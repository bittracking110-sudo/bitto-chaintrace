<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>専任サポート — Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c12; --bg2:#0e1119; --panel:#12151f;
  --line:#232838; --line2:#2a3045;
  --gold:#c9a96e; --gold2:#e3cfa4; --gold-dim:rgba(201,169,110,.14);
  --text:#eae6dc; --sub:#8b91a0; --sub2:#b8bcc8; --red:#d97b7b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;display:flex;flex-direction:column;height:100dvh}
header{background:rgba(10,12,18,.92);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:6px;color:var(--gold);font-weight:600}
.hd-sub{font-size:11px;color:var(--sub);letter-spacing:2px}
.rep-link{font-size:12px;color:var(--gold);text-decoration:none;border:1px solid rgba(201,169,110,.35);padding:7px 14px;border-radius:6px;letter-spacing:1px;white-space:nowrap}

#chat{flex:1;overflow-y:auto;padding:24px 16px;max-width:720px;width:100%;margin:0 auto}
.notice{text-align:center;font-size:12px;color:var(--sub);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:22px;line-height:1.9;letter-spacing:.5px}
.msg{display:flex;margin-bottom:16px}
.msg.user{justify-content:flex-end}
.bubble{max-width:78%;padding:13px 18px;border-radius:14px;line-height:1.9;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--gold);color:#0a0c12;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--panel);border:1px solid var(--line2);border-bottom-left-radius:4px}
.msg .who{font-size:10.5px;color:var(--sub);letter-spacing:2px;margin-bottom:5px}
.wrap-a{display:flex;flex-direction:column;align-items:flex-start;max-width:78%}
.wrap-a .bubble{max-width:100%}
.typing{display:inline-flex;gap:5px;padding:16px 20px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.inbar{flex-shrink:0;border-top:1px solid var(--line);background:var(--bg2);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.inrow{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;padding:13px 16px;outline:none;resize:none;max-height:120px;line-height:1.6;transition:border-color .3s}
textarea:focus{border-color:var(--gold)}
.send{background:var(--gold);color:#0a0c12;border:none;font-weight:700;font-size:13px;letter-spacing:2px;padding:13px 24px;border-radius:12px;cursor:pointer;flex-shrink:0}
.send:disabled{background:#3a3f50;color:#6a7080;cursor:not-allowed}
.err{color:var(--red);font-size:12px;text-align:center;padding:8px 0 0;display:none}

/* ── サイドバー ── */
.menu-btn{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--gold);font-size:17px;padding:7px 12px;cursor:pointer;line-height:1;flex-shrink:0}
.menu-btn:hover{border-color:var(--gold)}
#sideOvl{position:fixed;inset:0;background:rgba(5,6,10,.65);backdrop-filter:blur(2px);z-index:90;display:none;opacity:0;transition:opacity .3s}
#sideOvl.open{display:block;opacity:1}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--bg2);border-right:1px solid var(--line2);z-index:100;transform:translateX(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:26px 0}
#sidebar.open{transform:none}
.sb-logo{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:7px;color:var(--gold);font-weight:600;padding:0 26px 8px}
.sb-rule{width:36px;height:1px;background:var(--gold);margin:8px 26px 22px}
.sb-item{display:flex;align-items:center;gap:14px;padding:15px 26px;color:var(--sub2);text-decoration:none;font-size:13.5px;letter-spacing:1.5px;border-left:2px solid transparent;transition:all .2s;cursor:pointer}
.sb-item:hover{background:var(--gold-dim);color:var(--text)}
.sb-item.active{color:var(--gold2);border-left-color:var(--gold);background:var(--gold-dim)}
.sb-item .ic{width:20px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:20px 26px;font-size:10.5px;color:var(--sub);letter-spacing:1px;line-height:1.9;border-top:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:14px">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="メニュー">☰</button>
    <div>
      <div class="logo">CONNECTION</div>
      <div class="hd-sub">専任サポートチャット</div>
    </div>
  </div>
  <a class="rep-link" id="repLink" href="#" target="_blank" style="display:none">調査報告書を開く ↗</a>
</header>

<!-- サイドバー -->
<div id="sideOvl" onclick="toggleSidebar()"></div>
<nav id="sidebar">
  <div class="sb-logo">CONNECTION</div>
  <div class="sb-rule"></div>
  <a class="sb-item" href="/connection"><span class="ic">🏠</span>ホーム（資金追跡）</a>
  <a class="sb-item" id="sbReport" href="#" target="_blank" style="display:none"><span class="ic">📄</span>調査報告書</a>
  <a class="sb-item active"><span class="ic">💬</span>サポートチャット</a>
  <div class="sb-foot">Blockchain Forensics<br>&amp; Asset Tracing</div>
</nav>

<div id="chat">
  <div class="notice">
    ご購入いただいた調査報告書に関するご質問を承ります。<br>
    凍結要請の進め方・警察への提出手順など、お気軽にご相談ください。
  </div>
</div>

<div class="inbar">
  <div class="inrow">
    <textarea id="input" rows="1" placeholder="ご質問を入力してください"></textarea>
    <button class="send" id="sendBtn" onclick="send()">送信</button>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
const token = location.pathname.split('/').pop();
const chatEl = document.getElementById('chat');

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sideOvl').classList.toggle('open');
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role === 'assistant'){
    div.innerHTML = `<div class="wrap-a"><div class="who">CONNECTION&nbsp;SUPPORT</div><div class="bubble">${esc(text)}</div></div>`;
  } else {
    div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing';
  div.innerHTML = `<div class="wrap-a"><div class="bubble typing"><i></i><i></i><i></i></div></div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeTyping(){ document.getElementById('typing')?.remove(); }

async function load(){
  try{
    const r = await fetch('/api/connection/chat/' + token);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || '読み込みに失敗しました');
    if(j.reportUrl){
      const link = document.getElementById('repLink');
      link.href = j.reportUrl;
      link.style.display = 'inline-block';
      const sbRep = document.getElementById('sbReport');
      sbRep.href = j.reportUrl;
      sbRep.style.display = 'flex';
    }
    (j.messages || []).forEach(m => addMsg(m.role, m.text));
    if(!(j.messages || []).length){
      addMsg('assistant', `${j.customerName} 様\nこの度はConnectionをご利用いただき誠にありがとうございます。\n調査報告書の内容や、今後のお手続きについてご不明な点がございましたら、何なりとお申し付けください。`);
    }
  }catch(e){
    addMsg('assistant', e.message);
  }
}

async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  const btn = document.getElementById('sendBtn');
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', text);
  btn.disabled = true;
  addTyping();
  try{
    const r = await fetch('/api/connection/chat/' + token, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text }),
    });
    const j = await r.json();
    removeTyping();
    if(!r.ok) throw new Error(j.error || '送信に失敗しました');
    addMsg('assistant', j.reply);
  }catch(e){
    removeTyping();
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
  btn.disabled = false;
}

const ta = document.getElementById('input');
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; });
ta.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

load();
</script>
</body>
</html>
