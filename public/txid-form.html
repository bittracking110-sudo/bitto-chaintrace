<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BitTo TXID入力フォーム</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a2b2e; color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; padding: 24px 16px 60px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 28px; }
    .header .logo { font-size: 2.2rem; margin-bottom: 8px; }
    .header h1 { font-size: 1.4rem; color: #f0f2f5; font-weight: 700; }
    .header p { color: #9aa0a6; font-size: 0.88rem; margin-top: 6px; }
    .card { background: #3c3d41; border: 1px solid #4a4b50; border-radius: 14px; padding: 22px; margin-bottom: 14px; }
    .card h2 { font-size: 0.95rem; color: #bdc1c6; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #4a4b50; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #4a4b50; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #9aa0a6; font-size: 0.83rem; }
    .info-value { color: #e8eaed; font-size: 0.9rem; font-weight: 600; }
    .count-badge { background: #174ea6; color: #8ab4f8; padding: 4px 12px; border-radius: 20px; font-weight: 700; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.83rem; color: #9aa0a6; margin-bottom: 5px; }
    .txid-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .txid-row input {
      flex: 1; background: #2a2b2e; border: 1px solid #4a4b50;
      border-radius: 8px; padding: 11px 13px; color: #e8eaed;
      font-size: 0.83rem; outline: none; font-family: 'Courier New', monospace;
      transition: border-color 0.2s;
    }
    .txid-row input:focus { border-color: #8ab4f8; }
    .txid-row input::placeholder { color: #5f6368; font-family: sans-serif; font-size: 0.82rem; }
    .chain-tag {
      background: #174ea6; color: #8ab4f8; font-size: 0.75rem; font-weight: 700;
      padding: 3px 9px; border-radius: 6px; white-space: nowrap; min-width: 38px;
      text-align: center;
    }
    .chain-tag.eth { background: #1e3a5a; color: #60a5fa; }
    .chain-tag.xrp { background: #1e3045; color: #7dd3fc; }
    .chain-tag.unknown { background: #3c3d41; color: #5f6368; border: 1px solid #4a4b50; }
    .warn-box { background: #2d2a14; border: 1px solid #5a4e1d; border-radius: 8px; padding: 10px 14px; color: #fdd663; font-size: 0.82rem; margin-bottom: 14px; line-height: 1.6; }
    .submit-btn {
      width: 100%; background: #1a73e8; border: none; border-radius: 10px;
      padding: 15px; color: #fff; font-size: 1.02rem; font-weight: 700;
      cursor: pointer; margin-top: 6px; transition: background 0.2s;
    }
    .submit-btn:hover { background: #1557b0; }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .success-box {
      background: #1e3a1e; border: 1px solid #2d5a2d; border-radius: 12px;
      padding: 28px; text-align: center; display: none;
    }
    .success-box .icon { font-size: 3rem; margin-bottom: 12px; }
    .success-box h2 { color: #81c995; font-size: 1.1rem; margin-bottom: 10px; }
    .success-box p { color: #9aa0a6; font-size: 0.88rem; line-height: 1.7; }
    .error-msg { background: #3c2020; border: 1px solid #7f1d1d; border-radius: 8px; padding: 11px 13px; color: #f28b82; font-size: 0.83rem; margin-top: 10px; display: none; }
    .loading { text-align: center; padding: 40px; color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔗</div>
      <h1>BitTo TXID入力フォーム</h1>
      <p>調査するトランザクションIDを入力してください</p>
    </div>

    <div id="loadingState" class="loading">読み込み中...</div>

    <div id="mainForm" style="display:none">
      <!-- お客様情報 -->
      <div class="card">
        <h2>📋 お申し込み内容</h2>
        <div class="info-row">
          <span class="info-label">お客様名</span>
          <span class="info-value" id="displayName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">入力できるTXID件数</span>
          <span class="info-value"><span class="count-badge" id="displayCount">—</span></span>
        </div>
      </div>

      <!-- TXID入力 -->
      <div class="card">
        <h2>🔢 TXIDを入力してください</h2>
        <div class="warn-box" id="warnBox">
          ⚠️ このフォームは<strong>1回のみ</strong>使用可能です。<br>
          BTC・ETH・XRP のTXIDを貼り付けてください。チェーンは自動判定されます。
        </div>
        <div id="txidList"></div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitTxids()">
        🔍 調査を開始する
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- 送信完了 -->
    <div class="success-box" id="successBox">
      <div class="icon">✅</div>
      <h2 id="successTitle">調査を開始しました！</h2>
      <p id="successMsg">TXIDを受け付けました。<br>
      調査完了後、LINEとメールにレポートURLをお送りします。<br><br>
      通常1〜3分でお届けします。</p>
      <div id="resultArea" style="margin-top:20px"></div>
    </div>
  </div>

  <script>
    const token = location.pathname.split('/').pop();
    let maxCount = 1;
    let isConnection = false;
    let resultPollTimer = null;

    function detectChain(txid) {
      const s = txid.trim();
      if (/^0x[0-9a-fA-F]{64}$/.test(s)) return 'eth';
      if (/^[0-9a-fA-F]{64}$/.test(s)) return s === s.toUpperCase() ? 'xrp' : 'btc';
      return null;
    }

    function createTxidRow(index) {
      const row = document.createElement('div');
      row.className = 'txid-row';
      row.id = `row-${index}`;

      const label = document.createElement('div');
      label.style.cssText = 'font-size:0.8rem;color:#9aa0a6;margin-bottom:4px';
      label.textContent = `TXID ${index + 1}`;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'TXIDを貼り付け（BTC / ETH / XRP 自動判定）';
      input.id = `txid-${index}`;

      const tag = document.createElement('span');
      tag.className = 'chain-tag unknown';
      tag.textContent = '?';
      tag.id = `tag-${index}`;

      input.addEventListener('input', () => {
        const chain = detectChain(input.value);
        tag.className = 'chain-tag ' + (chain || 'unknown');
        tag.textContent = chain ? chain.toUpperCase() : '?';
      });

      const wrap = document.createElement('div');
      wrap.style.marginBottom = '12px';
      wrap.appendChild(label);
      const inputRow = document.createElement('div');
      inputRow.style.cssText = 'display:flex;gap:8px;align-items:center';
      inputRow.appendChild(input);
      inputRow.appendChild(tag);
      wrap.appendChild(inputRow);
      return wrap;
    }

    async function init() {
      try {
        const res = await fetch(`/api/txid-form-info/${token}`);
        const data = await res.json();

        if (!res.ok) {
          // TXID送信済み（used）なら、報告書の状況を表示する。
          // 以前はConnectionだけを対象にしていたため、BitToではアプリのレポートタブから
          // 開いても「使用済みです」で行き止まりになり、報告書にたどり着けなかった。
          if (data.used) {
            isConnection = (data.brand === 'connection');
            showStatusForUsedToken();
            return;
          }
          document.getElementById('loadingState').innerHTML =
            `<div style="text-align:center;padding:40px;color:#f28b82">
              <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
              <p>${data.error || 'このリンクは無効です'}</p>
            </div>`;
          return;
        }

        maxCount = data.count;
        document.getElementById('displayName').textContent = data.customerName + ' 様';
        document.getElementById('displayCount').textContent = `${data.count}件`;

        // Connectionブランドの場合は表示を切り替え
        if (data.brand === 'connection') {
          isConnection = true;
          document.title = 'Connection｜お申し込み完了';
          document.querySelector('.header .logo').textContent = '';
          document.querySelector('.header h1').textContent = 'Connection';
          document.querySelector('.header h1').style.cssText = 'letter-spacing:2px;color:#c9a96e;font-family:Georgia,serif;font-size:1.8rem';
          document.querySelector('.header p').textContent = 'お申し込みありがとうございます';
          // 申込内容カードの見出しを変更
          document.querySelectorAll('.card h2')[0].textContent = '📋 お申し込み内容';
          document.querySelectorAll('.card h2')[1].textContent = '🔢 調査するTXIDをご入力ください';
          // 案内メッセージ
          document.getElementById('warnBox').innerHTML =
            '<strong style="color:#fdd663">お申し込みが完了しました。</strong><br>' +
            'TXIDを1件ずつ入力し、完了しましたら調査を申請ください。<br>' +
            '<span style="color:#f28b82">※TXIDの相違が無いようにお願いします。</span>';
          document.getElementById('submitBtn').textContent = '調査を申請する';
        }

        const list = document.getElementById('txidList');
        for (let i = 0; i < data.count; i++) {
          list.appendChild(createTxidRow(i));
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainForm').style.display = 'block';
      } catch (e) {
        document.getElementById('loadingState').textContent = 'エラーが発生しました。ページを再読み込みしてください。';
      }
    }

    async function submitTxids() {
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';

      const txids = [];
      for (let i = 0; i < maxCount; i++) {
        const input = document.getElementById(`txid-${i}`);
        if (!input) continue;
        const val = input.value.trim();
        if (!val) continue;
        const chain = detectChain(val);
        if (!chain) {
          errorEl.textContent = `TXID ${i+1} のチェーンを認識できません。\nBTC/ETH/XRPのTXIDを確認してください。`;
          errorEl.style.display = 'block';
          return;
        }
        txids.push({ txid: val, chain });
      }

      if (txids.length === 0) {
        errorEl.textContent = 'TXIDを1件以上入力してください。';
        errorEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      try {
        const res = await fetch('/api/submit-txids', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, txids }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '送信に失敗しました');

        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';

        if (isConnection) {
          document.getElementById('successTitle').textContent = '調査を申請しました';
          document.getElementById('successMsg').innerHTML =
            'TXID ' + txids.length + '件を受け付けました。<br>ただいま調査を行っております。<br>' +
            '<span style="color:#9aa0a6;font-size:0.85rem">通常10〜30分で完成します。このページを開いたままお待ちください。</span>';
          startResultPolling();
        }
      } catch (e) {
        errorEl.textContent = 'エラー: ' + e.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = isConnection ? '調査を申請する' : '🔍 調査を開始する';
      }
    }

    function startResultPolling() {
      const area = document.getElementById('resultArea');
      area.innerHTML = '<div style="display:inline-block;width:22px;height:22px;border:2px solid #4a4b50;border-top-color:#c9a96e;border-radius:50%;animation:spin 0.9s linear infinite"></div>' +
        '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
      let polls = 0;
      resultPollTimer = setInterval(async () => {
        polls++;
        if (polls > 200) { clearInterval(resultPollTimer); return; }
        try {
          const r = await fetch(`/api/txid-form-result/${token}`);
          const j = await r.json();
          if (j.status === 'done' && j.report) {
            clearInterval(resultPollTimer);
            renderReport(j.report);
          } else if (j.status === 'error') {
            clearInterval(resultPollTimer);
            area.innerHTML = `<p style="color:#f28b82;font-size:0.85rem">調査中にエラーが発生しました。サポートよりご連絡いたします。</p>`;
          }
        } catch (e) {}
      }, 4000);
    }

    // 完成した報告書＋サポートチャットのリンクを表示
    function renderReport(report) {
      document.getElementById('successTitle').textContent = '正式調査報告書が完成しました';
      // サポートチャットはConnectionのみ。BitToでは chatUrl が無いので出さない
      document.getElementById('successMsg').innerHTML = report.chatUrl
        ? '調査報告書と専任サポートチャットは、ご登録のメールアドレスにもお送りしています。'
        : '調査報告書は、ご登録のメールアドレスにもお送りしています。';
      document.getElementById('resultArea').innerHTML =
        `<a href="${report.reportUrl}" target="_blank" style="display:block;background:#c9a96e;color:#0a0c12;text-decoration:none;padding:14px;border-radius:8px;font-weight:700;letter-spacing:1px;margin-bottom:12px">📄 調査報告書を開く</a>` +
        (report.chatUrl ? `<a href="${report.chatUrl}" target="_blank" style="display:block;background:#2a2b2e;color:#c9a96e;text-decoration:none;padding:14px;border-radius:8px;font-weight:600;border:1px solid #c9a96e">💬 専任サポートチャット</a>` : '') +
        `<p style="font-size:0.78rem;color:#8b91a0;margin-top:14px">このページのリンクは大切に保管してください。</p>`;
    }

    // ヘッダーをConnection表示に切り替え
    function applyConnectionHeader() {
      document.title = 'Connection｜調査状況';
      const logo = document.querySelector('.header .logo'); if (logo) logo.textContent = '';
      const h1 = document.querySelector('.header h1');
      if (h1) { h1.textContent = 'Connection'; h1.style.cssText = 'letter-spacing:2px;color:#c9a96e;font-family:Georgia,serif;font-size:1.8rem'; }
      const p = document.querySelector('.header p'); if (p) p.textContent = 'お申し込みありがとうございます';
    }

    // TXID送信済み（used）の再アクセス時：完成済みなら報告書、調査中なら進捗を表示
    async function showStatusForUsedToken() {
      // BitToでもこの画面を使うため、Connection用の見出し差し替えは該当時のみ
      if (isConnection) applyConnectionHeader();
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('mainForm').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('successTitle').textContent = '調査状況';
      document.getElementById('successMsg').innerHTML = '調査状況を確認しています…';
      try {
        const r = await fetch(`/api/txid-form-result/${token}`);
        const j = await r.json();
        if (j.status === 'done' && j.report) { renderReport(j.report); return; }
        if (j.status === 'error') {
          document.getElementById('successMsg').innerHTML = '';
          document.getElementById('resultArea').innerHTML = `<p style="color:#f28b82;font-size:0.85rem">調査中にエラーが発生しました。サポートよりご連絡いたします。</p>`;
          return;
        }
      } catch (e) {}
      // まだ調査中 → 完成までポーリング
      document.getElementById('successTitle').textContent = '調査中です';
      document.getElementById('successMsg').innerHTML =
        'ただいま調査を行っております。<br><span style="color:#9aa0a6;font-size:0.85rem">完成すると、このページに報告書が表示されます。</span>';
      startResultPolling();
    }

    init();
  </script>
</body>
</html>
