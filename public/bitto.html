<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BitTo｜暗号資産解析chat</title>
<meta name="description" content="TXIDを貼るだけ。BitToのAIが暗号資産の資金の流れを追跡し、到達した取引所候補までを可視化します。">
<style>
  :root{
    /* ネイビー基調・やや明るめ（ロゴの紺 #16294A に寄せる） */
    --bg:#0C1728; --panel:#152741; --panel2:#1B3050; --line:#2C4468;
    --text:#EAF2FA; --sub:#93A8C4; --sub2:#C4D3E4;
    --teal:#34E1C8; --green:#3DDC97; --blue:#2F6FE8;
    --amber:#FBBF24; --red:#F87171; --grey:#7C8FA8;
    --navh:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif;
    font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  /* ── ヘッダー ── */
  header{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:14px 16px calc(14px) 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#16294A,#0C1728);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:30px;height:30px;flex:none}
  .wordmark{font-size:19px;font-weight:800;letter-spacing:.5px}
  .wordmark .b{color:var(--teal)}
  .hd-title{flex:1;text-align:center;font-size:14.5px;font-weight:600;letter-spacing:.5px}
  .beta{
    display:inline-block;margin-left:7px;padding:1px 6px;border-radius:4px;
    font-size:10px;font-weight:700;color:#062A25;background:var(--teal);vertical-align:2px;
  }
  .hd-ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--sub2);font-size:14px}

  /* ── チャット領域 ── */
  #chat{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
  .row{display:flex;gap:9px;margin-bottom:16px;align-items:flex-start}
  .row.me{justify-content:flex-end}
  .avatar{width:30px;height:30px;border-radius:8px;flex:none;background:var(--panel2);
    border:1px solid var(--line);display:grid;place-items:center}
  .avatar svg{width:18px;height:18px}
  .bubble{max-width:min(78%,560px);padding:12px 14px;border-radius:14px;
    background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .bubble.wide{max-width:100%}   /* 結果カードを含む吹き出しは列幅いっぱいに */
  .row.me .bubble{background:var(--blue);border-color:transparent;color:#fff;border-bottom-right-radius:5px}
  .row.ai .bubble{border-bottom-left-radius:5px}
  .who{font-size:11px;color:var(--sub);margin-bottom:4px}
  .row.me .who{text-align:right}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;opacity:.95}

  /* タイピング */
  .dots{display:inline-flex;gap:4px;padding:4px 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:bl 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ── 結果カード ── */
  /* 吹き出しの pre-wrap を打ち消す（カード内のHTMLインデントが空白として描画されるのを防ぐ） */
  .card, .card *{white-space:normal}
  .card{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .card + .card{margin-top:10px}
  .card h4{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--sub2);letter-spacing:1px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .stat .k{font-size:10.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .stat .v{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:.3px}
  .stat .n{font-size:10px;color:var(--sub);margin-top:1px}

  .risks{display:grid;gap:8px}
  .risk{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px}
  .risk .ic{width:18px;text-align:center}
  .risk .t{font-size:12.5px;font-weight:600}
  .risk .d{font-size:10.5px;color:var(--sub)}
  .risk.ok .ic{color:var(--green)} .risk.warn .ic{color:var(--amber)} .risk.bad .ic{color:var(--red)}

  /* フロー */
  .flow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:flex-start}
  .node{flex:none;min-width:132px;max-width:160px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;position:relative}
  .node .hop{font-size:9.5px;color:var(--sub);letter-spacing:.5px}
  .node .nm{font-size:12px;font-weight:700;margin-top:2px;line-height:1.35;word-break:break-word}
  .node .ad{font-size:10px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .node .am{font-size:11px;color:var(--sub2);margin-top:4px}
  .badge{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px}
  .b-known{background:rgba(61,220,151,.18);color:var(--green);border:1px solid rgba(61,220,151,.42)}
  .b-guess{background:rgba(251,191,36,.16);color:var(--amber);border:1px solid rgba(251,191,36,.42)}
  .b-via{background:rgba(125,180,255,.16);color:#A9CBFF;border:1px solid rgba(125,180,255,.42)}
  .b-unk{background:rgba(124,143,168,.18);color:#A9BBD0;border:1px solid rgba(124,143,168,.42)}
  .arrow{flex:none;align-self:center;color:var(--sub);font-size:15px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:10.5px;color:var(--sub)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

  .note{font-size:10.5px;color:var(--sub);margin-top:9px;line-height:1.6}

  /* ── 入力バー ── */
  #inputbar{flex:none;border-top:1px solid var(--line);background:#0F2039;padding:10px 12px}
  .ib{display:flex;gap:9px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:8px 10px}
  #msg{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;
    resize:none;max-height:110px;min-height:22px;line-height:1.5;font-family:inherit}
  #msg::placeholder{color:var(--sub)}
  .send{flex:none;width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--teal),var(--green));color:#04231F;display:grid;place-items:center}
  .send:disabled{opacity:.4;cursor:not-allowed}
  .disc{font-size:10px;color:var(--sub);text-align:center;margin-top:7px;line-height:1.5}

  /* ── 下部ナビ ── */
  nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
    background:#0F2039;padding-bottom:env(safe-area-inset-bottom)}
  nav button{background:none;border:none;color:var(--sub);cursor:pointer;padding:9px 2px 10px;
    display:grid;justify-items:center;gap:3px;font-size:9.5px;font-family:inherit}
  nav button svg{width:19px;height:19px}
  nav button.on{color:var(--teal)}

  /* トースト */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 78px);
    background:#24406B;border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:9px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:88%}
  #toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="bt" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#10B981"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="url(#bt)" stroke-width="1.6"/>
      <path d="M10 9h6.5a4 4 0 0 1 0 8H10z" fill="none" stroke="url(#bt)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 17h7.5a3 3 0 0 1 0 6H10z" fill="none" stroke="url(#bt)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="23.5" cy="8.5" r="2" fill="url(#bt)"/>
    </svg>
    <div class="wordmark"><span class="b">Bit</span>To</div>
  </div>
  <div class="hd-title">暗号資産解析chat<span class="beta">β</span></div>
  <div class="hd-ic">🔔</div>
</header>

<main id="chat" aria-live="polite"></main>

<div id="inputbar">
  <div class="ib">
    <textarea id="msg" rows="1" placeholder="TXIDを入力して調査を開始"></textarea>
    <button class="send" id="send" aria-label="送信">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="disc">AIの回答は参考情報であり、投資・法的判断の根拠にはなりません。</div>
</div>

<nav>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>AI調査チャット</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>解析履歴</button>
  <button data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 4.4-3 8.1-7 9-4-.9-7-4.6-7-9V6z"/></svg>ウォレット監視</button>
  <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>メニュー</button>
</nav>

<div id="toast"></div>

<script>
const API = '';               // 同一オリジン
const MAX_TXIDS = 5;          // 1メッセージあたりの上限
const chat = document.getElementById('chat');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
let busy = false;
const history = [];           // AI相談の会話履歴
let lastContext = null;       // 直近の追跡結果（AIに文脈として渡す）

/* ── 匿名化・ブリッジ判定（ラベル文字列から。実データのみ） ── */
const MIXER_KEYS  = ['tornado','mixer','wasabi','samourai','coinjoin','chipmixer','blender',
  'changenow','fixedfloat','simpleswap','sideshift','stealthex','exolix'];
const BRIDGE_KEYS = ['bridge','stargate','layerzero','hop protocol','across','celer','multichain',
  'anyswap','synapse','connext','thorchain','rubic','lifi','socket','squid','rango',
  'uniswap','sushiswap','pancakeswap','router','swap','dex','aggregator','1inch','paraswap','0x protocol'];
const hasKey = (label, keys) => { const l = (label||'').toLowerCase(); return keys.some(k => l.includes(k)); };
// DEX・ブリッジ・スワップは「通過点」であって取引所ではない（取引所候補から除外する）
const isBridgeLike = n => hasKey(n.label, BRIDGE_KEYS) || hasKey(n.label, MIXER_KEYS);
const isExchangeNode = n => n.isExchange && !isBridgeLike(n);

/* ── ユーティリティ ── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortAddr = a => a ? a.slice(0,6) + '…' + a.slice(-4) : '不明';
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2600); }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function detectChain(t){
  const s = (t||'').trim();
  if (/^0x[0-9a-fA-F]{64}$/.test(s)) return 'eth';
  if (/^[0-9a-fA-F]{64}$/.test(s))   return s === s.toUpperCase() ? 'xrp' : 'btc';
  return null;
}
function extractTxids(text){
  return (text.match(/0x[0-9a-fA-F]{64}|[0-9a-fA-F]{64}/g) || []).filter(t => detectChain(t));
}

/* ── メッセージ描画 ── */
const AI_AVATAR = `<div class="avatar"><svg viewBox="0 0 32 32" aria-hidden="true">
  <defs><linearGradient id="ba" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#10B981"/></linearGradient></defs>
  <path d="M10 9h6.5a4 4 0 0 1 0 8H10z" fill="none" stroke="url(#ba)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M10 17h7.5a3 3 0 0 1 0 6H10z" fill="none" stroke="url(#ba)" stroke-width="2.4" stroke-linejoin="round"/>
</svg></div>`;

function addMe(text){
  const d = document.createElement('div'); d.className = 'row me';
  d.innerHTML = `<div><div class="who">あなた</div><div class="bubble">${esc(text)}</div></div>`;
  chat.appendChild(d); scrollDown();
}
const hasCard = html => /class="card"/.test(String(html));
function addAi(html, {typing=false} = {}){
  const d = document.createElement('div'); d.className = 'row ai';
  d.innerHTML = `${AI_AVATAR}<div style="flex:1;min-width:0"><div class="who">BitTo AI</div>
    <div class="bubble${!typing && hasCard(html) ? ' wide' : ''}">${typing ? '<div class="dots"><i></i><i></i><i></i></div>' : html}</div></div>`;
  chat.appendChild(d); scrollDown(); return d;
}
const setBubble = (row, html) => {
  const b = row.querySelector('.bubble');
  b.classList.toggle('wide', hasCard(html));
  b.innerHTML = html; scrollDown();
};

/* ── 結果カードの組み立て ── */
function nodeBadge(n){
  if (isBridgeLike(n))                return `<span class="badge b-via">経由（DEX/ブリッジ）</span>`;
  if (n.isExchange && n.label)        return `<span class="badge b-known">判明</span>`;
  if (n.isExchange)                   return `<span class="badge b-guess">推定</span>`;
  return `<span class="badge b-unk">未特定</span>`;
}
function hopName(i, total){
  if (i === 0) return '送金元';
  if (i === total - 1) return `${i}次先`;
  return `${i}次先`;
}
function flowHTML(path){
  const nodes = path.slice(0, 6);   // 表示は最大6ノード
  return `<div class="flow">` + nodes.map((n,i) => `
    ${i ? '<div class="arrow">→</div>' : ''}
    <div class="node">
      <div class="hop">${esc(hopName(i, nodes.length))}</div>
      <div class="nm">${esc(n.label || (n.isExchange ? '取引所系ウォレット' : 'ウォレット'))}</div>
      <div class="ad">${esc(shortAddr(n.address))}</div>
      ${n.amount != null ? `<div class="am">${esc(String(n.amount).slice(0,10))}${n.token ? ' ' + esc(n.token) : ''}</div>` : ''}
      ${nodeBadge(n)}
    </div>`).join('') + `</div>
    <div class="legend">
      <span><i style="background:#3DDC97"></i>判明（取引所名あり）</span>
      <span><i style="background:#FBBF24"></i>推定（振る舞いから）</span>
      <span><i style="background:#7DB4FF"></i>経由（DEX/ブリッジ）</span>
      <span><i style="background:#7C8FA8"></i>未特定</span>
    </div>`;
}
function resultCard(results){
  const paths   = results.map(r => r.path || []);
  const addrs   = new Set(); paths.forEach(p => p.forEach(n => n.address && addrs.add(n.address)));
  // 取引所（CEX）と 経由（DEX/ブリッジ/匿名化）を厳密に分ける
  const exNodes  = []; const viaNodes = [];
  paths.forEach(p => p.forEach(n => {
    if (isBridgeLike(n))      viaNodes.push(n);
    else if (n.isExchange)    exNodes.push(n);
  }));
  const exNames = [...new Set(exNodes.map(n => n.label).filter(Boolean))];

  // 金額はチェーンごとに集計（為替換算はしない＝推測値を出さない）
  const byChain = {};
  results.forEach(r => {
    const unit = r.tokenSymbol || r.chain;
    const amt  = r.tokenAmount != null ? r.tokenAmount : r.amount;
    if (amt != null) byChain[unit] = (byChain[unit] || 0) + Number(amt);
  });
  const amountText = Object.entries(byChain).map(([u,v]) => `${(+v.toFixed(6))} ${u}`).join(' / ') || '—';

  // リスク：ラベル文字列から実際に検出できるものだけ
  const allLabels = [];
  paths.forEach(p => p.forEach(n => n.label && allLabels.push(n.label)));
  const mixer  = allLabels.filter(l => hasKey(l, MIXER_KEYS));
  const bridge = allLabels.filter(l => hasKey(l, BRIDGE_KEYS));

  const stats = `
  <div class="card"><h4>調査サマリー</h4><div class="stats">
    <div class="stat"><div class="k">🔗 追跡TXID数</div><div class="v">${results.length}件</div><div class="n">解析完了</div></div>
    <div class="stat"><div class="k">📍 追跡アドレス数</div><div class="v">${addrs.size}件</div><div class="n">経路上のアドレス</div></div>
    <div class="stat"><div class="k">🏦 取引所候補</div><div class="v">${exNodes.length}件</div><div class="n">判明${exNames.length}／推定${exNodes.length - exNames.length}</div></div>
    <div class="stat"><div class="k">💰 追跡総額</div><div class="v" style="font-size:14px">${esc(amountText)}</div><div class="n">オンチェーン値</div></div>
  </div></div>`;

  const risk = `
  <div class="card"><h4>リスク検出</h4><div class="risks">
    <div class="risk ${mixer.length ? 'bad':'ok'}"><div class="ic">${mixer.length ? '⚠️':'✓'}</div>
      <div><div class="t">匿名化・スワップ経由</div>
      <div class="d">${mixer.length ? esc([...new Set(mixer)].join('、')) + ' を経由' : '該当する経路は検出されませんでした'}</div></div></div>
    <div class="risk ${bridge.length ? 'warn':'ok'}"><div class="ic">${bridge.length ? '⚠️':'✓'}</div>
      <div><div class="t">ブリッジ・DEX経由</div>
      <div class="d">${bridge.length ? esc([...new Set(bridge)].join('、')) + ' を経由' : '該当する経路は検出されませんでした'}</div></div></div>
  </div>
  <div class="note">※ 検出は判明したラベル情報に基づきます。ラベルが未取得のアドレスについては判定できません。</div></div>`;

  const flows = results.map((r,i) => `
    <div class="card"><h4>資金フロー（概要）${results.length>1 ? ` ${i+1}/${results.length}` : ''} — ${esc(r.chain)}</h4>
      ${flowHTML(r.path || [])}
      ${(() => {
        const ex = [...new Set((r.exchanges || []).filter(n => !hasKey(n, BRIDGE_KEYS) && !hasKey(n, MIXER_KEYS)))];
        return ex.length ? `<div class="note">到達した取引所：${esc(ex.join('、'))}</div>` : '';
      })()}
    </div>`).join('');

  const viaNote = viaNodes.length ? `（途中で <b>${esc([...new Set(viaNodes.map(n=>n.label))].join('、'))}</b> を経由しています）` : '';
  const summaryLine = exNames.length
    ? `到達した取引所として <b>${esc(exNames.join('、'))}</b> を確認しました。${viaNote}`
    : exNodes.length
      ? `取引所系とみられるウォレットに到達しましたが、<b>名称は特定できていません（推定）</b>。${viaNote}`
      : viaNodes.length
        ? `資金はDEX・ブリッジ等を経由しており、<b>現時点で既知の取引所には到達していません</b>。${viaNote}`
        : '現時点で既知の取引所には到達していません。';

  return `調査が完了しました。以下が結果の概要です。\n\n${summaryLine}${stats}${risk}${flows}
    <div class="note">本結果は公開ブロックチェーン情報に基づく情報提供です。資産の回復・犯人の特定を保証するものではありません。</div>`;
}

/* ── 調査の実行 ── */
async function runInvestigation(txids){
  const row = addAi('', {typing:true});
  await new Promise(r => setTimeout(r, 400));
  setBubble(row, `TXIDを受け取りました。オンチェーンデータを取得しています…<div class="dots" style="margin-top:6px"><i></i><i></i><i></i></div>`);

  const results = [];
  for (const txid of txids){
    try{
      const s = await fetch(API + '/api/connection/investigate', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ txid })
      });
      const j = await s.json();
      if (!s.ok) throw new Error(j.error || '調査を開始できませんでした');

      // ジョブ完了までポーリング（最大3分）
      let done = null;
      for (let i = 0; i < 90; i++){
        await new Promise(r => setTimeout(r, 2000));
        const p = await fetch(`${API}/api/connection/job/${j.jobId}`);
        const q = await p.json();
        if (q.status === 'done')  { done = q.result; break; }
        if (q.status === 'error') throw new Error(q.error || '調査に失敗しました');
      }
      if (!done) throw new Error('調査がタイムアウトしました');
      results.push(done);
    }catch(e){
      setBubble(row, `⚠️ ${esc(e.message || '調査に失敗しました')}\n\nTXIDが正しいか確認のうえ、もう一度お試しください。`);
      return;
    }
  }

  setBubble(row, resultCard(results));

  // AI相談に渡す文脈を保存
  const r0 = results[0];
  const exNames = [...new Set(results.flatMap(r => (r.path||[]).filter(n=>n.isExchange&&n.label).map(n=>n.label)))];
  lastContext = {
    chain: r0.chain,
    amount: r0.tokenAmount != null ? `${r0.tokenAmount} ${r0.tokenSymbol||''}` : `${r0.amount} ${r0.chain}`,
    hops: (r0.path||[]).length - 1,
    reachedExchange: results.some(r => (r.path||[]).some(n => n.isExchange)),
    exchanges: exNames,
    viaDex: results.some(r => (r.path||[]).some(n => hasKey(n.label, BRIDGE_KEYS)))
  };

  addAi('この結果について、気になる点があれば何でも質問してください。今後の進め方（取引所への連絡・記録の残し方など）もご案内できます。');
}

/* ── AI相談 ── */
async function askAI(text){
  const row = addAi('', {typing:true});
  try{
    const r = await fetch(API + '/api/connection/consult', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ brand:'bitto', message:text, messages:history.slice(-10), context:lastContext })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '応答を取得できませんでした');
    const reply = j.reply || j.text || 'ご相談ありがとうございます。担当者が確認のうえご案内いたします。';
    setBubble(row, esc(reply));
    history.push({role:'user',text}, {role:'ai',text:reply});
  }catch(e){
    setBubble(row, `⚠️ ${esc(e.message || '通信に失敗しました')}`);
  }
}

/* ── 送信 ── */
async function send(){
  const text = msgEl.value.trim();
  if (!text || busy) return;
  const txids = extractTxids(text);
  if (txids.length > MAX_TXIDS){ toast(`一度に調査できるのは${MAX_TXIDS}件までです`); return; }

  busy = true; sendBtn.disabled = true;
  addMe(text);
  msgEl.value = ''; msgEl.style.height = 'auto';

  try{
    if (txids.length) await runInvestigation(txids);
    else              await askAI(text);
  } finally {
    busy = false; sendBtn.disabled = false; msgEl.focus();
  }
}

sendBtn.addEventListener('click', send);
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
msgEl.addEventListener('input', () => { msgEl.style.height='auto'; msgEl.style.height = Math.min(msgEl.scrollHeight,110)+'px'; });

/* ── 下部ナビ（コア以外は準備中） ── */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  const tab = b.dataset.tab;
  if (tab === 'chat') return;
  toast('この機能は準備中です（近日公開）');
}));

/* ── 初回メッセージ ── */
addAi(`こんにちは。<b>BitTo</b> の調査AIです。\n\n調べたい送金の <b>トランザクションID（TXID）</b> を貼り付けて送信してください。ビットコイン・イーサリアム・XRP に対応しています。\n\n資金がどのアドレスを経由し、どの取引所に到達したかを追跡して表示します。<span class="mono">（追跡は無料です）</span>`);
</script>
