# 報告書のPDF生成（puppeteer）に必要なものをコンテナへ入れる。
#
# ・chromium
#     puppeteer 同梱のChromiumはビルド時にzipで落としてくるが、
#     このコンテナには unzip が無く展開に失敗する（ビルドが落ちる）。
#     OS側のchromiumを使えばダウンロード自体が不要になり、ビルドも速い。
#
# ・fonts-noto-cjk / fonts-noto-color-emoji
#     コンテナには日本語フォントも絵文字フォントも入っていない。
#     入れないとPDFの日本語がすべて豆腐（□）になる。
#     報告書は警察や取引所へ提出する書類なので必須。

[phases.setup]
aptPkgs = ["chromium", "fonts-noto-cjk", "fonts-noto-color-emoji", "ca-certificates"]

[variables]
# 同梱Chromiumのダウンロードを止める（上のOS側chromiumを使う）
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
